- id: liu2025energy
  type: journal
  selected: true
  year: 2025
  title: "Leveraging electric vehicles as a resiliency solution for residential backup power during outages"
  authors: ["Shanshan Liu", "Alex Vlachokostas", "Eleftheria Kontou*"]
  venue: "Energy"
  volume: "318"
  article: "134613"
  doi: "10.1016/j.energy.2025.134613"
  open_access: true
  themes: [resilience]
  summary: >-
    Simulates vehicle-to-home (V2H) backup across nine U.S. climate regions,
    four seasons, and short, long, and extreme outages, and proposes metrics
    for household energy and mobility resilience.
  takeaway: >-
    Even at 50% charge, today's EVs can carry a home through a 12-hour outage
    in spring and autumn in every climate region studied except the Midwest.

- id: liu2025buildenv
  type: journal
  selected: true
  year: 2025
  title: "Resilience and environmental benefits of electric school buses as backup power for educational functions continuation during outages"
  authors: ["Shanshan Liu", "Alex Vlachokostas", "Eleftheria Kontou*"]
  venue: "Building and Environment"
  volume: "269"
  article: "112329"
  doi: "10.1016/j.buildenv.2024.112329"
  open_access: true
  data: "https://doi.org/10.13012/B2IDB-4925630_V1"
  themes: [resilience]
  summary: >-
    Assesses whether electric school bus fleets, using vehicle-to-building
    (V2B) technology, can keep secondary schools operating through power
    outages in representative cities across nine U.S. climate regions.
  takeaway: >-
    Today's fleets cannot carry a whole school, but V2B cuts emissions
    compared with diesel generators — and gathering students in classrooms
    markedly improved resilience in a Houston case study.

- id: liu2024trd
  type: journal
  selected: true
  year: 2024
  title: "Coupled management of electric vehicle workplace charging and office building loads"
  authors: ["Shanshan Liu", "Alex Vlachokostas", "Chen Si", "Eleftheria Kontou*"]
  venue: "Transportation Research Part D: Transport and Environment"
  venue_short: "Transportation Research Part D"
  volume: "134"
  article: "104317"
  doi: "10.1016/j.trd.2024.104317"
  open_access: true
  oa: "https://www.osti.gov/servlets/purl/2480318"
  themes: [ev-building]
  mentee: "Chen Si"
  summary: >-
    Couples office-building energy simulation (HVAC setpoints, daylighting)
    with commuters' travel patterns to size how many workplace EVs saved
    building energy can charge, then minimizes charging cost under
    time-of-use pricing in Chicago, Baltimore, and Houston.
  takeaway: >-
    Managing workplace charging together with building loads lowers charging
    bills compared with first-come, first-served charging.

- id: liu2022scs
  type: journal
  selected: true
  year: 2022
  title: "Quantifying transportation energy vulnerability and its spatial patterns in the United States"
  authors: ["Shanshan Liu", "Eleftheria Kontou*"]
  venue: "Sustainable Cities and Society"
  volume: "82"
  article: "103805"
  doi: "10.1016/j.scs.2022.103805"
  open_access: true
  data: "https://doi.org/10.13012/B2IDB-9337369_V2"
  themes: [vulnerability]
  note_award: "Selected as an ITF Young Researcher of the Year 2023 finalist paper"
  summary: >-
    Introduces a data-driven framework that measures exposure, sensitivity,
    and adaptive capacity to transportation energy burdens and maps
    vulnerability across U.S. census tracts.
  takeaway: >-
    Electric-vehicle adoption narrows spatial disparities in transportation
    energy vulnerability, but with diminishing returns over time.

- id: ye2024tranpol
  type: journal
  year: 2024
  title: "Managed residential electric vehicle charging minimizes electricity bills while meeting driver and community preferences"
  authors: ["Tinghan Ye", "Shanshan Liu", "Eleftheria Kontou*"]
  venue: "Transport Policy"
  volume: "149"
  pages: "122–138"
  doi: "10.1016/j.tranpol.2024.01.022"
  open_access: true
  themes: [ev-building]
  mentee: "Tinghan Ye"
  summary: >-
    A mathematical programming framework shifts home charging to low-price
    hours using granular household energy data from Austin, Texas, while
    honoring driver and community preferences. Under time-of-use EV tariffs,
    optimized charging cut households' daily electricity costs by 38.9% in
    summer and 44.3% in winter.

- id: rapti2023bmb
  type: journal
  year: 2023
  title: "The role of mobility in the dynamics of the COVID-19 epidemic in Andalusia"
  authors: ["Zoi Rapti*", "Jesús Cuevas-Maraver", "Eleftheria Kontou", "Shanshan Liu", "Yannis Drossinos", "P. G. Kevrekidis", "M. Barmann", "Q.-Y. Chen", "George A. Kevrekidis"]
  authors_short: ["Zoi Rapti*", "Jesús Cuevas-Maraver", "Eleftheria Kontou", "Shanshan Liu", "et al."]
  venue: "Bulletin of Mathematical Biology"
  volume: "85"
  number: "6"
  article: "54"
  doi: "10.1007/s11538-023-01152-5"
  oa: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10173246/"
  themes: [mobility]
  summary: >-
    A metapopulation epidemic model of Andalusia, Spain (summer–fall 2020)
    shows that time-dependent mobility matrices built from mobile-phone data
    are key to capturing the emergence of the second COVID-19 wave.

- id: zheng2020jat
