- id: bao2026ssrn
  type: preprint
  year: 2026
  title: "Weather-conditioned mobility patterns before and after New York City congestion pricing"
  authors: ["Wencheng Bao", "Shanshan Liu*"]
  venue: "SSRN preprint"
  note: "Under revision at Transportation Research Part A: Policy and Practice"
  doi: "10.2139/ssrn.7435471"
  themes: [mobility]
  summary: >-
    Combines vehicle entries, taxi and ride-hail trips, subway ridership, and
    borough weather around New York City's January 2025 congestion pricing to
    show how calendar baselines, data-source boundaries, and weather shape
    what such policy evaluations can and cannot conclude.

