  title: "Route design model of multiple feeder bus service based on existing bus lines"
  authors: ["Meina Zheng", "Runxuan Zhou", "Shanshan Liu", "Feng Liu", "Xiucheng Guo"]
  authors_short: ["Meina Zheng", "Runxuan Zhou", "Shanshan Liu", "et al."]
